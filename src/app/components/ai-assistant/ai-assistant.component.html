<mat-card class="ai-panel" appearance="outlined">
  <div class="ai-panel__header">
    <div class="ai-title">
      <mat-icon class="ai-avatar" aria-hidden="true">smart_toy</mat-icon>
      <div>
        <strong>AI Assistant</strong>
        <small>Ask about ticket #{{ ticket.id }}</small>
      </div>
    </div>
    <button
      mat-button
      type="button"
      class="ai-clear"
      (click)="clear()"
      *ngIf="messages.length"
    >
      Clear
    </button>
  </div>

  <div class="ai-panel__messages">
    <div class="ai-empty" *ngIf="!messages.length">
      <p>Hi! I can help you understand and resolve this ticket. Try a quick prompt below.</p>
    </div>

    <div
      *ngFor="let msg of messages"
      class="bubble"
      [class.bubble--user]="msg.role === 'user'"
      [class.bubble--ai]="msg.role === 'assistant'"
    >
      <p>{{ msg.content }}</p>
    </div>

    <div class="bubble bubble--ai typing" *ngIf="thinking">
      <span></span><span></span><span></span>
    </div>
  </div>

  <mat-chip-set class="ai-panel__prompts" aria-label="Quick prompts">
    <mat-chip
      *ngFor="let p of quickPrompts"
      (click)="!thinking && send(p)"
      [disabled]="thinking"
    >
      {{ p }}
    </mat-chip>
  </mat-chip-set>

  <form class="ai-panel__input" (ngSubmit)="send()">
    <mat-form-field appearance="outline" class="ai-input-field" subscriptSizing="dynamic">
      <input
        matInput
        type="text"
        placeholder=" Ask the assistant..."
        [(ngModel)]="question"
        name="question"
        [disabled]="thinking"
        aria-label=" Ask the AI assistant"
      />
    </mat-form-field>
    <button
      mat-flat-button
      color="primary"
      type="submit"
      [disabled]="thinking || !question.trim()"
    >
      <mat-icon>send</mat-icon>
    </button>
  </form>
</mat-card>
